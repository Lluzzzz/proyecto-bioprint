# OPCIONAL: ejemplo de configuración con almacenamiento DURADERO en plan de pago.
# Render usará render.yaml por defecto. Para aplicar esta versión debes reemplazar
# render.yaml por el contenido de este ejemplo, aceptar los costos y redeplegar.
services:
  - type: web
    name: bioprint-vasc-semana2
    runtime: python
    plan: 0.5c-512mb
    buildCommand: python -m compileall -q app.py numericos.py
    startCommand: python app.py
    healthCheckPath: /api/health
    envVars:
      - key: BIOPRINT_DB_PATH
        value: /opt/render/project/src/storage/bioprint.sqlite3
    disk:
      name: historial-bioprint
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
